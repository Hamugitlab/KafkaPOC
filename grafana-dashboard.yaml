      "panel-250": {
        "kind": "Panel",
        "spec": {
          "data": {
            "kind": "QueryGroup",
            "spec": {
              "queries": [
                {
                  "kind": "PanelQuery",
                  "spec": {
                    "hidden": false,
                    "query": {
                      "datasource": {
                        "name": "${datasource}"
                      },
                      "group": "mssql",
                      "kind": "DataQuery",
                      "spec": {
                        "editorMode": "code",
                        "format": "table",
                        "rawQuery": true,
                        "rawSql": "DECLARE @s FLOAT=100;\nDECLARE @ple INT=(SELECT cntr_value FROM sys.dm_os_performance_counters WHERE object_name LIKE '%Buffer Manager%' AND counter_name='Page life expectancy');\nDECLARE @blk INT=(SELECT COUNT(*) FROM sys.dm_exec_requests WHERE blocking_session_id>0);\nDECLARE @mg INT=(SELECT COUNT(*) FROM sys.dm_exec_query_memory_grants WHERE grant_time IS NULL);\nDECLARE @ch FLOAT=(SELECT CAST(SUM(CASE WHEN usecounts>1 THEN 1 ELSE 0 END) AS FLOAT)/NULLIF(COUNT(*),0)*100 FROM sys.dm_exec_cached_plans WHERE objtype IN('Adhoc','Prepared'));\nIF @ple<300 SET @s=@s-25 ELSE IF @ple<600 SET @s=@s-10;\nIF @blk>0 SET @s=@s-(@blk*10);\nIF @mg>0 SET @s=@s-(@mg*15);\nIF @ch<80 SET @s=@s-15 ELSE IF @ch<90 SET @s=@s-5;\nIF @s<0 SET @s=0;\nSELECT CAST(@s AS INT) AS [Health];"
                      },
                      "version": "v0"
                    },
                    "refId": "A"
                  }
                }
              ],
              "queryOptions": {},
              "transformations": []
            }
          },
          "description": "Composite health score 0-100: PLE, blocking, memory grants, cache hit",
          "id": 250,
          "links": [],
          "title": "🩺 Health Score",
          "vizConfig": {
            "group": "gauge",
            "kind": "VizConfig",
            "spec": {
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "mappings": [
                    {
                      "options": {
                        "from": 90,
                        "result": {
                          "color": "#3F51B5",
                          "text": "EXCELLENT"
                        },
                        "to": 100
                      },
                      "type": "range"
                    },
                    {
                      "options": {
                        "from": 70,
                        "result": {
                          "color": "#7C4DFF",
                          "text": "GOOD"
                        },
                        "to": 89
                      },
                      "type": "range"
                    },
                    {
                      "options": {
                        "from": 50,
                        "result": {
                          "color": "#E040FB",
                          "text": "WARNING"
                        },
                        "to": 69
                      },
                      "type": "range"
                    },
                    {
                      "options": {
                        "from": 0,
                        "result": {
                          "color": "#F50057",
                          "text": "CRITICAL"
                        },
                        "to": 49
                      },
                      "type": "range"
                    }
                  ],
                  "max": 100,
                  "min": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "#F50057",
                        "value": 0
                      },
                      {
                        "color": "#E040FB",
                        "value": 50
                      },
                      {
                        "color": "#7C4DFF",
                        "value": 70
                      },
                      {
                        "color": "#3F51B5",
                        "value": 90
                      }
                    ]
                  },
                  "unit": "percent"
                },
                "overrides": []
              },
              "options": {
