      "panel-901": {
        "kind": "Panel",
        "spec": {
          "data": {
            "kind": "QueryGroup",
            "spec": {
              "queries": [
                {
                  "kind": "PanelQuery",
                  "spec": {
                    "hidden": false,
                    "query": {
                      "datasource": {
                        "name": "${datasource}"
                      },
                      "group": "mssql",
                      "kind": "DataQuery",
                      "spec": {
                        "editorMode": "code",
                        "format": "table",
                        "rawQuery": true,
                        "rawSql": "SELECT TOP 20\n    OBJECT_NAME(ips.object_id) AS [Table],\n    i.name AS [Index],\n    CAST(ips.avg_fragmentation_in_percent AS DECIMAL(5,1)) AS [Frag %],\n    ips.page_count AS [Pages],\n    CASE\n      WHEN ips.avg_fragmentation_in_percent > 30 THEN 'REBUILD'\n      WHEN ips.avg_fragmentation_in_percent > 10 THEN 'REORGANIZE'\n      ELSE 'OK'\n    END AS [Action]\nFROM sys.dm_db_index_physical_stats(DB_ID(),NULL,NULL,NULL,'LIMITED') ips\nJOIN sys.indexes i ON ips.object_id=i.object_id AND ips.index_id=i.index_id\nWHERE ips.avg_fragmentation_in_percent > 5 AND ips.page_count > 50 AND i.name IS NOT NULL\nORDER BY ips.avg_fragmentation_in_percent DESC;"
                      },
                      "version": "v0"
                    },
                    "refId": "A"
                  }
                }
              ],
              "queryOptions": {},
              "transformations": []
            }
          },
