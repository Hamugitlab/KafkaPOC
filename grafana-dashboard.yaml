      "panel-902": {
        "kind": "Panel",
        "spec": {
          "data": {
            "kind": "QueryGroup",
            "spec": {
              "queries": [
                {
                  "kind": "PanelQuery",
                  "spec": {
                    "hidden": false,
                    "query": {
                      "datasource": {
                        "name": "${datasource}"
                      },
                      "group": "mssql",
                      "kind": "DataQuery",
                      "spec": {
                        "editorMode": "code",
                        "format": "table",
                        "rawQuery": true,
                        "rawSql": "SELECT TOP 15\n    OBJECT_NAME(s.object_id) AS [Table],\n    i.name AS [Index],\n    s.user_updates AS [Updates],\n    CAST(SUM(a.total_pages)*8.0/1024 AS DECIMAL(10,2)) AS [Size MB]\nFROM sys.dm_db_index_usage_stats s\nJOIN sys.indexes i ON s.object_id=i.object_id AND s.index_id=i.index_id\nJOIN sys.partitions p ON i.object_id=p.object_id AND i.index_id=p.index_id\nJOIN sys.allocation_units a ON p.partition_id=a.container_id\nWHERE s.database_id=DB_ID()\n  AND OBJECTPROPERTY(s.object_id,'IsUserTable')=1\n  AND s.user_seeks=0 AND s.user_scans=0 AND s.user_lookups=0\n  AND s.user_updates > 0\n  AND i.index_id > 1\nGROUP BY OBJECT_NAME(s.object_id), i.name, s.user_updates\nORDER BY s.user_updates DESC;"
                      },
                      "version": "v0"
                    },
                    "refId": "A"
                  }
                }
              ],
              "queryOptions": {},
              "transformations": []
            }
