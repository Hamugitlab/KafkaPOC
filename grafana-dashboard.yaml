                      "group": "mssql",
                      "kind": "DataQuery",
                      "spec": {
                        "editorMode": "code",
                        "format": "table",
                        "rawQuery": true,
                        "rawSql": "SELECT TOP 20 j.name AS [Job],\n    CASE WHEN a.run_requested_date IS NOT NULL AND a.stop_execution_date IS NULL THEN 'Running' ELSE 'Scheduled' END AS [Status],\n    s.next_run_date AS [Next Run],\n    s.next_run_time AS [Time]\nFROM msdb.dbo.sysjobs j\nLEFT JOIN msdb.dbo.sysjobactivity a ON j.job_id=a.job_id\nLEFT JOIN msdb.dbo.sysjobschedules s ON j.job_id=s.job_id\nWHERE (a.stop_execution_date IS NULL AND a.run_requested_date IS NOT NULL) OR s.next_run_date>0\nORDER BY s.next_run_date, s.next_run_time;"
